name: Mobile wallet CI

# Runs on every push/PR touching firstislamiccoin-mobile/. The analyze/test
# job runs for real, right now, with no external dependencies -- it's the
# same `flutter analyze`/`flutter test` this project's own Phase 5 work
# verified locally (see docs/CHANGELOG-FIC.md). The build job needs signing
# secrets that do not exist yet (see the release job below and
# docs/CHANGELOG-FIC.md's TODO-HUMAN table) and will fail at the sign step
# until a human provides them -- committed as ready-to-run infrastructure,
# not proof a signed build has happened.

on:
  push:
    branches: [main]
    paths:
      - "firstislamiccoin-mobile/**"
  pull_request:
    paths:
      - "firstislamiccoin-mobile/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: firstislamiccoin-mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: "flutter pub get (also runs l10n codegen -- see pubspec.yaml's generate: true)"
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      # Debug build only -- proves the Android toolchain/Gradle
      # configuration actually compiles, without needing a release
      # signing key. See release-android below for the signed build.
      - name: flutter build apk --debug
        run: flutter build apk --debug

  release-android:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      # Requires four repository secrets that do not exist yet -- see
      # docs/CHANGELOG-FIC.md's TODO-HUMAN table:
      #   ANDROID_KEYSTORE_BASE64   the release .jks/.keystore file, base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # Generating a real release keystore is a one-way, irreversible
      # decision (losing it means losing the ability to update the app
      # under its existing Play Store listing forever) -- deliberately
      # left for a human to do with their own secure key management, not
      # generated by this workflow or by this session.
      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set -- see this job's own comments and docs/CHANGELOG-FIC.md's TODO-HUMAN table."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: firstislamiccoin-mobile/build/app/outputs/bundle/release/app-release.aab

  release-ios:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Requires an Apple Developer Program membership, a distribution
      # certificate, and a provisioning profile -- none of which exist
      # yet (see docs/CHANGELOG-FIC.md's TODO-HUMAN table). This job is
      # written to the point CI infrastructure can reach without those --
      # it will fail at codesign for the same reason release-android
      # fails without its keystore secrets: real signing material a
      # human has to provide, not something to fake here.
      - name: flutter build ipa --release --no-codesign
        run: flutter build ipa --release --no-codesign

      - name: "TODO-HUMAN: codesign and upload to App Store Connect"
        run: |
          echo "::error::Signing requires a real Apple Distribution certificate and provisioning profile -- see this job's own comments and docs/CHANGELOG-FIC.md's TODO-HUMAN table. --no-codesign build above is unsigned and cannot be submitted."
          exit 1
